<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #fff;
    }

    .note {
      position: fixed;
      top: 9px;
      left: 12px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: normal;
      color: #000;
      opacity: 0.6;
      pointer-events: none;
      white-space: pre;
    }

    /* 加载动画字符：用等宽字体保证 | / - \ 四帧宽度一致 */
    .spinner-char {
      display: inline-block;
      font-family: 'Courier New', Courier, monospace;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      margin-left: 0px;
      position: relative;
      top: 0px;
    }
  </style>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R2XSCZV91Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-R2XSCZV91Y');
  </script>

</head>

<body>
  <!-- 默认先给一个 spinner，这样即使 JS 整个挂掉也能看到一个静态字符 -->
  <div class="note" id="note"><span class="spinner-char" id="spinner">|</span></div>

  <script>
    (function () {
      try {
        const noteEl = document.getElementById('note');
        const spinnerEl = document.getElementById('spinner');
        if (!noteEl) return; // 极端兜底

        // spinner 动画：标准 ASCII 旋转序列
        var spinnerFrames = ['/', '-', '\\', '|'];
        var spinnerIndex = 0;
        var spinnerTimer = null;

        function startSpinner() {
          if (spinnerTimer) return;
          spinnerTimer = setInterval(function () {
            spinnerIndex = (spinnerIndex + 1) % spinnerFrames.length;
            if (spinnerEl) spinnerEl.textContent = spinnerFrames[spinnerIndex];
          }, 150);
        }

        function stopSpinner() {
          if (spinnerTimer) {
            clearInterval(spinnerTimer);
            spinnerTimer = null;
          }
        }

        // 检测是否是刷新
        let isReload = false;
        try {
          const navEntries = performance.getEntriesByType &&
            performance.getEntriesByType('navigation');
          if (navEntries && navEntries.length > 0) {
            isReload = navEntries[0].type === 'reload';
          } else if (performance.navigation) {
            isReload = performance.navigation.type === 1;
          }
        } catch (e) {
          isReload = false;
        }

        // 是否曾来过（本 tab 会话）
        const VISIT_KEY = 'noinfo_hasVisited';
        const hasVisited = sessionStorage.getItem(VISIT_KEY) === 'true';

        // 这句台词在本会话中是否已经出现过
        const TEXT_SHOWN_KEY = 'noinfo_textShown';
        const textShown = sessionStorage.getItem(TEXT_SHOWN_KEY) === 'true';

        let message = "";

        // 只有刷新 + 曾经来过 才触发随机事件
        if (isReload && hasVisited) {
          const r = Math.random();

          if (!textShown) {
            // 还没说过那句话：只有机会刷出台词，不会出现 repo
            if (r < 0.05) { // 台词概率（可以自己调）
              message = 'I told you it<span style="display:inline-block;width:3px"></span>s empty';
              sessionStorage.setItem(TEXT_SHOWN_KEY, 'true');
            }
          } else {
            // 已经说过台词：现在才允许出现 repo 泄露
            if (r < 0.005) { // repo 极小概率（可以改成 0.01 等）
              message = '[fallback] resolved from source: https://github.com/yuhangchill/noinfoin';
            }
          }
        }

        // 如果 message 是空 → 显示 spinner 加载动画
        // 如果 message 有内容 → 停止 spinner，显示文字
        if (message === "") {
          startSpinner();
        } else {
          stopSpinner();
          noteEl.innerHTML = message;
        }

        // 标记已经访问过
        sessionStorage.setItem(VISIT_KEY, 'true');
      } catch (e) {
        // 如果这里有任何异常，什么都不做，
        // 保持 HTML 里原本的静态 | 字符
        console && console.warn && console.warn('noinfo.in script error:', e);
      }
    })();
  </script>
</body>

</html>
