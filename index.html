<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
    }

    .note {
      position: fixed;
      top: 10px;
      left: 12px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: normal;
      color: #000;
      opacity: 0.6;
      pointer-events: none;
      white-space: pre;
    }

    /* 闪烁光标（默认状态） */
    .cursor::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 0.8em;
      background: #000;
      margin-left: 3px;
      margin-top: 4px;
      animation: blink 1s steps(2, start) infinite;
      vertical-align: baseline;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R2XSCZV91Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-R2XSCZV91Y');
  </script>

</head>

<body>
  <!-- 默认先给一个 cursor 类，这样即使 JS 整个挂掉也能看到光标 -->
  <div class="note cursor" id="note"></div>

  <script>
    (function () {
      try {
        const noteEl = document.getElementById('note');
        if (!noteEl) return; // 极端兜底

        // 检测是否是刷新
        let isReload = false;
        try {
          const navEntries = performance.getEntriesByType &&
                             performance.getEntriesByType('navigation');
          if (navEntries && navEntries.length > 0) {
            isReload = navEntries[0].type === 'reload';
          } else if (performance.navigation) {
            isReload = performance.navigation.type === 1;
          }
        } catch (e) {
          isReload = false;
        }

        // 是否曾来过（本 tab 会话）
        const VISIT_KEY = 'noinfo_hasVisited';
        const hasVisited = sessionStorage.getItem(VISIT_KEY) === 'true';

        // 这句台词在本会话中是否已经出现过
        const TEXT_SHOWN_KEY = 'noinfo_textShown';
        const textShown = sessionStorage.getItem(TEXT_SHOWN_KEY) === 'true';

        let message = "";

        // 只有刷新 + 曾经来过 才触发随机事件
        if (isReload && hasVisited) {
          const r = Math.random();

          if (!textShown) {
            // 还没说过那句话：只有机会刷出台词，不会出现 repo
            if (r < 0.05) { // 台词概率（可以自己调）
              message = 'I told you it<span style="display:inline-block;width:3px"></span>s empty';
              sessionStorage.setItem(TEXT_SHOWN_KEY, 'true');
            }
          } else {
            // 已经说过台词：现在才允许出现 repo 泄露
            if (r < 0.005) { // repo 极小概率（可以改成 0.01 等）
              message = '[fallback] resolved from source: https://github.com/chqiu666/noinfoin';
            }
          }
        }

        // 用 innerHTML 才能解析 span（实现可控宽度空隙）
        noteEl.innerHTML = message;

        // 如果 message 是空 → 保持/添加 cursor 类（显示闪烁光标）
        // 如果 message 有内容 → 移除 cursor（只显示文字）
        if (message === "") {
          noteEl.classList.add('cursor');
        } else {
          noteEl.classList.remove('cursor');
        }

        // 标记已经访问过
        sessionStorage.setItem(VISIT_KEY, 'true');
      } catch (e) {
        // 如果这里有任何异常，什么都不做，
        // 保持 HTML 里原本的 <div class="note cursor">（至少还有光标）
        console && console.warn && console.warn('noinfo.in script error:', e);
      }
    })();
  </script>
</body>
</html>
